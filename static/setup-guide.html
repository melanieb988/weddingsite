<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Setup Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ec; --paper:#fffdf9; --ink:#2a2620; --muted:#7a7166; --line:#e4dccf;
  --gold:#b8913a; --gold-d:#8f6d24; --gold-l:#f1e6cc;
  --todo:#b8913a; --prog:#d9822b; --done:#3f8f5a;
  --shadow:0 1px 2px rgba(60,45,20,.06),0 6px 20px rgba(60,45,20,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1680px;margin:0 auto;padding-left:14px;padding-right:14px}
.hidden{display:none!important}
.spacer{flex:1}

header{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:8px;flex-wrap:wrap}
.brand h1{font-size:26px;line-height:1}
.brand .sub{color:var(--muted);font-size:12px;margin-top:3px}
.layouts{display:flex;gap:4px;margin-left:8px}
.layouts button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 16px;font-weight:700;font-size:13px;color:var(--muted)}
.layouts button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.mode{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.mode button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.mode button.on{background:var(--ink);color:#fff}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.green{background:var(--done);border-color:var(--done);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:#a33}
.progress{display:flex;align-items:center;gap:10px;min-width:200px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);transition:width .3s}
.progress b{font-size:13px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.editbar{background:#2a2620;color:#f1e6cc;font-size:12.5px}
.editbar .wrap{display:flex;gap:10px;align-items:center;padding-top:7px;padding-bottom:7px;flex-wrap:wrap}
.editbar .btn{background:transparent;color:#fff;border-color:#5a5146}
.editbar .btn.gold{background:var(--gold);border-color:var(--gold)}
main{padding-top:12px;padding-bottom:60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* map */
.fpcard{padding:10px}
.fptools{display:flex;gap:14px;align-items:center;padding:0 4px 8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.fptools label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:11.5px;color:var(--ink);padding:0 6px 8px}
.key span{display:inline-flex;align-items:center;gap:4px}
.palette{position:sticky;top:0;z-index:12;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#2a2620;color:#f1e6cc;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12px}
.palette .pi{display:inline-flex;align-items:center;gap:5px;background:#3a342c;border:1px solid #5a5146;border-radius:7px;padding:4px 8px 4px 5px;cursor:grab;touch-action:none;user-select:none;color:#fff;font-weight:600}
.palette .pi:hover{border-color:var(--gold)}
.palette .trash{margin-left:auto;border:1px dashed #b06a5c;color:#f0b7aa;border-radius:7px;padding:5px 10px}
.palette .trash.hot{background:#7a2e22;color:#fff}
.fpscroll{overflow:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.fp{position:relative;width:100%;min-width:1100px;user-select:none}
.fp img{display:block;width:100%;height:auto;pointer-events:none;opacity:.72}
.ic{position:absolute;transform:translate(-50%,-50%);width:13px;height:13px;padding:0;border:0;background:none;z-index:3;touch-action:none;line-height:0}
.ic svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 1px #fff)}
.ic:hover{z-index:9;transform:translate(-50%,-50%) scale(1.5)}
.hit{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:0;background:transparent;z-index:2;padding:0;touch-action:none}
.edit .hit{border:1.5px dashed rgba(42,38,32,.55);background:rgba(255,255,255,.25);cursor:move}
.edit .hit::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#2a2620}
.pill{position:absolute;transform:translate(-50%,-50%);z-index:6;border:0;background:none;padding:1px 3px;font-size:9px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;line-height:1.1;color:#6f675c;white-space:nowrap;touch-action:none;
  text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 0 3px #fff}
.pill:hover{color:#1d1914;z-index:11}
.pill.prog{color:#c06a17} .pill.done{color:var(--done)}
.edit .pill{cursor:move;outline:1px dashed rgba(42,38,32,.45);outline-offset:1px;border-radius:3px}
.sdot{position:absolute;width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;transform:translate(-50%,-50%);z-index:4;pointer-events:none;font-size:7px;color:#fff;display:grid;place-items:center;font-weight:800}
.sdot.prog{background:var(--prog)} .sdot.done{background:var(--done)}
.tag{position:absolute;z-index:5;background:#fff;border:1px solid #bfb08f;border-left:4px solid var(--todo);border-radius:4px;padding:3px 6px 4px 5px;
     font-size:10.5px;line-height:1.3;color:#1d1914;white-space:nowrap;cursor:pointer;touch-action:none;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tag:hover{z-index:10;border-color:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tag.prog{border-left-color:var(--prog)} .tag.done{border-left-color:var(--done)}
.tag .tn{font-weight:800;font-size:11px;color:#1d1914;border-bottom:1px solid #e6dcc8;margin-bottom:2px;padding-bottom:1px}
.tag.done .tn{color:var(--done)}
.tag .tl{display:flex;align-items:center;gap:3px}
.tag .tl svg{width:11px;height:11px;flex:none}
.tag .tl b{font-weight:700}
.nolists .tag .tl{display:none}
.noicons .ic:not(.keep){display:none}
.edit .tag{cursor:move}
.hit.mk{width:20px;height:20px;border:1.5px dotted #8a7f70;background:rgba(255,255,255,.6)}
.hit.mk::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#8a7f70}
.hit.mk.prog{border-color:var(--prog)} .hit.mk.done{border-color:var(--done);border-style:solid}
.edit .hit.mk{width:28px;height:28px}
.hit.target{border:2px solid var(--gold)!important;background:rgba(184,145,58,.28)!important;width:40px!important;height:40px!important}
.lbl{position:absolute;transform:translate(-50%,-50%);z-index:4;pointer-events:none;font-size:9px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;line-height:1.1;color:#6f675c;white-space:nowrap;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff}
.lbl.prog{color:#c06a17} .lbl.done{color:var(--done)}
.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.leaders line{stroke:#a3967f;stroke-width:1;stroke-dasharray:3 3}
.fp.edit.noicons .ic:not(.keep){display:block;opacity:.8}
.fp.placing{cursor:crosshair}
.fp.placing *{cursor:crosshair!important}
.placebar{position:sticky;top:0;z-index:13;background:var(--gold);color:#fff;font-weight:700;border-radius:10px;padding:9px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.placebar .btn{margin-left:auto;color:var(--ink)}
.steps{opacity:.9}.steps b{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--gold);color:#fff;font-size:10.5px;margin-left:6px}
.ghost{position:fixed;z-index:100;pointer-events:none;width:22px;height:22px;transform:translate(-50%,-50%)}
.tray{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:8px 12px;border:1px dashed #e0b9c6;background:#fdf5f7;border-radius:10px;font-size:12.5px}
.tchip{display:inline-flex;align-items:center;gap:6px;border:1px solid #e9c7d2;background:#fff;border-radius:99px;padding:3px 10px 3px 5px;font-weight:600;cursor:pointer}
.tchip svg{width:14px;height:14px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(30,26,20,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
.modal{background:var(--paper);border-radius:16px;width:min(980px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.mh{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{font-size:28px;line-height:1.05}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip.g{background:var(--gold-l);border-color:#e5d3a6;color:var(--gold-d)}
.badge{flex:none;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;color:#fff;background:var(--todo)}
.badge.prog{background:var(--prog)} .badge.done{background:var(--done)}
.x{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;font-size:17px;flex:none}
.inst{display:flex;gap:6px;flex-wrap:wrap;padding:8px 18px;border-bottom:1px solid var(--line);background:#fcf9f3}
.inst button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;font-size:12px;font-weight:600}
.inst button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.inst button.d{background:#eef6f0;border-color:#bcd9c5;color:var(--done)}
.inst button.on.d{background:var(--done);color:#fff}
.mb{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
@media (max-width:800px){.mb{grid-template-columns:1fr}.ov{padding:0}.modal{border-radius:0;min-height:100%}}
.col{padding:16px 18px}
.col.l{background:#fcf9f3;border-right:1px solid var(--line)}
@media (max-width:800px){.col.l{border-right:0;border-bottom:1px solid var(--line)}}
.sh{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.photo{position:relative;border-radius:12px;overflow:hidden;background:#efe8dc}
.photo img{width:100%;max-height:440px;object-fit:contain;display:block;cursor:zoom-in;background:#efe8dc}
.photo .pb{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.photo .pb .btn{background:rgba(255,253,249,.94)}
.drop{border:2px dashed #d8c9a8;border-radius:12px;min-height:260px;display:grid;place-items:center;text-align:center;color:var(--muted);background:#fffdf8;cursor:pointer;padding:20px}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-l)}
.drop big{display:block;font-family:"Cormorant Garamond",serif;font-size:23px;color:var(--ink);font-weight:600}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs button{width:56px;height:42px;border-radius:6px;overflow:hidden;padding:0;border:2px solid transparent;background:#eee}
.thumbs button.on{border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.il{list-style:none;margin:0;padding:0}
.il li{display:grid;grid-template-columns:26px 20px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.il li:last-child{border-bottom:0}
.il li.on .nm{text-decoration:line-through;color:var(--muted)}
.il .box{width:24px;height:24px;border-radius:6px;border:2px solid #cfc3ab;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px}
.il li.on .box{background:var(--done);border-color:var(--done)}
.il .icn svg{width:20px;height:20px;display:block}
.il .nm{font-weight:600}
.il .nt{font-size:12px;color:var(--muted)}
.il .q{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:700;line-height:1;text-align:right}
.il .q small{display:block;font:600 9.5px Inter,sans-serif;color:var(--muted)}
.notes{white-space:pre-wrap;font-size:13.5px;background:#fff8e8;border:1px solid #f0dfb5;border-radius:10px;padding:9px 12px;margin-top:12px}
.lin{font-size:13px;margin-top:10px;color:var(--muted)} .lin b{color:var(--ink)}

/* edit rows */
.f{display:grid;gap:8px}
.f label{font-size:11.5px;font-weight:600;color:var(--muted);display:grid;gap:3px}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;width:100%}
.f textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.er{display:grid;grid-template-columns:20px 1fr 54px 28px;gap:6px;align-items:center;margin-bottom:6px}
.er svg{width:18px;height:18px}
.er select,.er input{border:1px solid var(--line);border-radius:6px;padding:5px 6px;width:100%;background:#fff;font-size:13px}
.er .note{grid-column:2 / 4}
.er .del{border:0;background:none;color:#a33;font-size:16px}
details.set{border-top:1px solid var(--line);padding:12px 18px}
details.set summary{cursor:pointer;font-weight:700;font-size:13px}

/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.sc{overflow:hidden;cursor:pointer}
.sc .ph{aspect-ratio:16/9;background:#efe8dc center/cover no-repeat}
.sc .ph.none{aspect-ratio:auto;height:8px}
.sc .bd{padding:12px 14px}
.sc h2{font-size:21px}
.mini{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px}
.mini li{display:flex;gap:6px;align-items:center;padding:3px 0;border-top:1px dashed var(--line)}
.mini li:first-child{border-top:0}
.mini svg{width:14px;height:14px;flex:none}
.mini b{margin-left:auto}
table.inv{width:100%;border-collapse:collapse;font-size:13.5px}
table.inv th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:10px;border-bottom:1px solid var(--line)}
table.inv td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.inv td.n{text-align:right;font-weight:700;font-size:16px;width:80px}
table.inv svg{width:20px;height:20px;display:block}
table.inv input,table.inv select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff;width:100%}
.wh{color:var(--muted);font-size:12px}
.prov{display:inline-block;font:600 10.5px Inter,sans-serif;color:#5d5447;background:#f1ece2;border:1px solid #e2d8c5;border-radius:99px;padding:1px 7px;vertical-align:1px}
.pfilter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.pfilter button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600}
.pfilter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.short{color:#b5541c;font-weight:700}.ok{color:var(--done);font-weight:700}
.rules{padding:18px 20px}.rules ul{margin:6px 0 0;padding-left:18px}.rules li{margin:5px 0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:120}
.toast.on{opacity:1}
.printonly{display:none}
@media print{
  @page{size:letter landscape;margin:.3in}
  body{background:#fff}
  header,.editbar,.tabpane,.ov,.toast{display:none!important}
  main{padding:0}
  .printonly{display:block!important}
  .pp{page-break-after:always;break-after:page}
  .pp:last-child{page-break-after:auto}
  .fp{min-width:0}
  .pg{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== clean view ===== */
.fp img{opacity:1;filter:none}
.fp{background:#fff}
.tag{z-index:6;background:#fff;border:1px solid #e3dac8;border-left:0;border-radius:7px;padding:6px 9px 7px;font-size:10.5px;line-height:1.3;color:#2c2820;
  box-shadow:0 1px 2px rgba(50,40,20,.06),0 3px 10px rgba(50,40,20,.06);max-width:210px;white-space:normal}
.tag::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2.5px;border-radius:2px;background:var(--gold)}
.tag.prog::before{background:var(--prog)} .tag.done::before{background:var(--done)}
.tag:hover{border-color:#cdb98b;box-shadow:0 2px 4px rgba(50,40,20,.08),0 8px 22px rgba(50,40,20,.12)}
.tag .tn{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:14.5px;line-height:1.05;color:#1f1b15;border:0;margin:0 0 4px;padding:0;white-space:nowrap}
.tag .tn .tx{font-family:Inter,sans-serif;font-size:10px;font-weight:600;color:var(--muted)}
.tag .tn .ok{color:var(--done)}
.tag .tsub{font-size:9.5px;color:var(--muted);margin:-2px 0 4px}
.tag .tg{display:grid;grid-template-columns:11px auto 1fr;column-gap:5px;row-gap:1.5px;align-items:center}
.tag .tg .ti{display:block;width:11px;height:11px}.tag .tg .ti svg{width:11px;height:11px;display:block}
.tag .tg b{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.tag .tg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.wide{max-width:none}
.tag.wide .tg{grid-template-columns:11px auto max-content 11px auto max-content;column-gap:5px}
.tag.wide .tg>span:nth-child(6n+3){padding-right:14px}
.nolists .tag .tg,.nolists .tag .tsub{display:none}
.nolists .tag .tn{margin:0}
.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.leaders line{stroke:#b9a57a;stroke-width:1;stroke-dasharray:1.5 2.5;stroke-linecap:round}
.leaders line.done{stroke:var(--done)} .leaders line.prog{stroke:var(--prog)}
.dot{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;border:0;padding:0;background:transparent;z-index:3;display:grid;place-items:center}
.dot::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(184,145,58,.35)}
.dot.prog::after{background:var(--prog)} .dot.done::after{background:var(--done);box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(63,143,90,.35)}
.dot:hover::after{transform:scale(1.35)}
.tbl{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;padding:0;z-index:4;background:#fff;border:1.5px solid #c9ad6c;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 1px 3px rgba(50,40,20,.12);touch-action:none;min-width:30px}
.tbl:hover{border-color:var(--gold-d);box-shadow:0 2px 8px rgba(50,40,20,.2)}
.tbl .tno{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:17px;line-height:.9;color:#1f1b15}
.tbl .tgu{font-size:7.5px;font-weight:600;color:#7a6f5f;line-height:1;white-space:nowrap}

.tbl.prog{border-color:var(--prog)} .tbl.done{border-color:var(--done);background:#f3faf5}

.tbledit input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:90px;font-size:15px;font-weight:700;background:#fff}

/* ===== setup-plan sheet ===== */
:root{--green:#2e4a3b;--green-l:#e7eee9;--paper:#ffffff;--bg:#f3f1eb;--line:#e3dfd4;--gold:#b8975a;--gold-d:#8a6d36;--gold-l:#f3ead6}
body{background:var(--bg)}
header{background:#fff}
.brand h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:34px;letter-spacing:.06em;text-transform:uppercase;color:#1f2a22}
.brand .sub{font-family:"Cormorant Garamond",Georgia,serif;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#4e5a51;margin-top:4px}
nav.tabs{gap:6px;padding:6px 0 10px}
nav.tabs button{border:1px solid var(--line);border-radius:3px;padding:7px 18px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#4e5a51;background:#f7f6f2}
nav.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.layouts button.on{background:var(--green);border-color:var(--green)}
.mode button.on{background:var(--green)}
.bar i{background:var(--green)}
.fpcard{border-radius:4px;box-shadow:none;border-color:var(--line)}
.fpscroll{border:0}
.fp img{opacity:1;filter:none}
.mkr{position:absolute;transform:translate(-50%,-11px);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;z-index:6;touch-action:none;cursor:pointer}
.mkr .mn{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font:700 12.5px/1 "Cormorant Garamond",Georgia,serif;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.25)}
.mkr .ml{margin-top:3px;font:700 8.5px/1.15 Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#1f2a22;text-align:center;white-space:nowrap;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 0 4px #fff}
.mkr.prog .mn{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--prog)}
.mkr.done .mn{background:var(--gold)}
.mkr:hover .mn{transform:scale(1.12)}
.mkr.ed .mn{outline:1.5px dashed #2e4a3b;outline-offset:3px}
.edit .mkr{cursor:move}
.sub{}
button.sub{position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;border:0;padding:0;background:transparent;z-index:5;display:grid;place-items:center;touch-action:none}
button.sub::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px #fff}
button.sub.done::after{background:var(--gold)}
button.sub.ed{outline:1.5px dashed var(--green);border-radius:50%;outline-offset:2px}
.dim{opacity:.22}
.tbl{border-color:#b9a77d}
.tbl .tno{color:#1f2a22}
.tbl.done{border-color:var(--gold);background:#fbf6ea}
.tbl .tck{background:var(--gold)}
#fp .ping .mn{animation:ping 1.6s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 2px #fff,0 0 0 2px rgba(46,74,59,.9)}100%{box-shadow:0 0 0 2px #fff,0 0 0 22px rgba(46,74,59,0)}}
.cardsec{margin-top:12px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
.edit ~ * .cgrid, body.editing .cgrid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.scard{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 10px 8px;display:flex;flex-direction:column;scroll-margin:130px;min-width:0}
.scard.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px rgba(46,74,59,.6)}100%{box-shadow:0 0 0 0 rgba(46,74,59,0)}}
@media (prefers-reduced-motion:reduce){.scard.flash{animation:none;outline:2px solid var(--green)}}
.scard .chd{display:flex;gap:8px;align-items:flex-start;background:none;border:0;position:static}
.nb{flex:none;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font:700 12.5px/1 "Cormorant Garamond",Georgia,serif}
.scard.done .nb{background:var(--gold)}
.nb.inv{background:#5b6b60;font-family:Inter,sans-serif;font-size:12px}
.hd2{min-width:0;flex:1}
.scard h3{font:700 13px/1.15 "Cormorant Garamond",Georgia,serif;letter-spacing:.07em;text-transform:uppercase;color:#1f2a22;margin-top:1px}
.scard .sub{font-size:10px;color:#7d837c;margin-top:2px}
.cname{width:100%;font:700 14px "Cormorant Garamond",Georgia,serif;border:1px solid var(--line);border-radius:4px;padding:3px 6px;background:#fff}
.cph{position:relative;margin:8px 0;border-radius:2px;overflow:hidden;background:#efece4;aspect-ratio:4/3}
.cph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.cph .cpb{position:absolute;right:5px;bottom:5px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.cph:hover .cpb,.cph:focus-within .cpb{opacity:1}
@media (hover:none){.cph .cpb{opacity:1}}
.cph .cpb .btn{background:rgba(255,255,255,.95);padding:3px 7px;font-size:11px}
.cph .cth{position:absolute;left:6px;bottom:7px;display:flex;gap:4px}
.cph .cth button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.6)}
.cph .cth button.on{background:#fff}
.cph.empty{width:100%;border:1.5px dashed #d3ccbb;background:#faf9f5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8a8d86;font-size:11.5px;cursor:pointer}
.cph.empty span{font-size:22px;color:var(--green);line-height:1}
.cph.empty:hover,.cph.over{border-color:var(--green);background:var(--green-l)}
.chk{list-style:none;margin:0;padding:0}
.chk li label{display:grid;grid-template-columns:14px 20px minmax(0,1fr);gap:6px;align-items:baseline;padding:2.5px 0;font-size:11.5px;line-height:1.3;cursor:pointer;color:#2b2f2a}
.chk input{width:12px;height:12px;margin:0;accent-color:var(--green);transform:translateY(1px)}
.chk b{text-align:right;font-variant-numeric:tabular-nums}
.chk em{display:block;font-style:normal;font-size:10px;color:#8a8d86}
.chk li.on span{color:#9a9d96;text-decoration:line-through}
.cnotes{white-space:pre-wrap;font-size:10.5px;color:#5b5f58;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.scard .cft{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.lnk{border:0;background:none;padding:0;font-size:11px;font-weight:600;color:var(--green);text-decoration:underline;text-underline-offset:2px}
.lnk.danger{color:#a33}
.cer .cr{display:grid;grid-template-columns:14px minmax(0,1fr) 44px 18px;gap:4px;align-items:center;margin-bottom:5px}
.cer .ci svg{width:13px;height:13px;display:block}
.cer select,.cer input{border:1px solid var(--line);border-radius:4px;padding:3px 5px;background:#fff;font-size:11.5px;width:100%;min-width:0}
.cer .cn{grid-column:2 / 4;font-size:11px}
.cer .x2{border:0;background:none;color:#a33;font-size:13px;padding:0}
.cf{margin-top:8px}.cf label{font-size:10.5px}.cf input,.cf textarea{font-size:11.5px;padding:4px 6px}.cf textarea{min-height:44px}
.scard.inv{grid-column:1 / -1}
.cgrid{align-items:start}
.invcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:0 28px;margin-top:8px;font-size:11px}
.ir{display:grid;grid-template-columns:minmax(0,1fr) 58px 62px 66px;gap:4px;padding:2.5px 0;border-bottom:1px solid #f1eee7;break-inside:avoid;font-variant-numeric:tabular-nums}
.ir span:not(:first-child){text-align:right}
.ir.ih{font-weight:700;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#6d726b;border-bottom:1px solid var(--line)}
.ir .neg{color:#b5541c;font-weight:700}
.ir input{width:48px;text-align:right;border:1px solid var(--line);border-radius:3px;padding:1px 4px;font-size:11px}
@media (max-width:480px){.scard.inv{grid-column:auto}}
.invt{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.invt th{text-align:right;font-weight:700;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#6d726b;padding:3px 4px;border-bottom:1px solid var(--line)}
.invt th:first-child,.invt td:first-child{text-align:left}
.invt td{text-align:right;padding:2.5px 4px;border-bottom:1px solid #f1eee7;font-variant-numeric:tabular-nums}
.invt td.neg{color:#b5541c;font-weight:700}
.invt input{width:48px;text-align:right;border:1px solid var(--line);border-radius:3px;padding:1px 4px;font-size:11px}
.cadd{margin-top:12px}

/* ===== v6: empty rings, badges, seats ===== */
.ring{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;padding:0;background:transparent;border:1.6px dotted #2e4a3b;z-index:4;touch-action:none;cursor:pointer}
.ring:hover{border-width:2.2px;border-style:solid;box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.ring.prog{border-color:var(--prog)} .ring.done{border:2px solid var(--gold)}
.ring.ed{border-style:dashed;border-width:1.8px;cursor:move}
.ring.target{border:2.5px solid var(--gold)!important;background:rgba(184,151,90,.18)!important}
.ring .rb{position:absolute;top:-9px;right:-11px;width:17px;height:17px;font-size:10.5px;box-shadow:0 0 0 1.5px #fff}
.ring.done .rb{background:var(--gold)}
.ring .rl{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:10px;font:700 9px/1.1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#1f2a22;white-space:nowrap;text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 4px #fff;pointer-events:none}
.tbadge{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.92);padding:3px 9px 3px 3px;border-radius:99px;box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:6;touch-action:none;cursor:pointer}
.tbadge .bl{font:700 9.5px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#1f2a22;white-space:nowrap}
.tbadge.done .nb{background:var(--gold)}
.edit .tbadge{cursor:move}
.tbl{border:1.5px solid #8c7a50;background:#fff}
.tbl .tno{font-size:19px}
.tbl .tgu{font-size:8px;color:#5d5340}
.tbl.target{border:2.5px solid var(--gold)!important}
.tagsonly{display:none!important}
.v-tags .tagsonly{display:inline-flex!important}
.tag{z-index:7}
.tag.dim,.ring.dim,.tbl.dim{opacity:.25}
.seats{display:grid;gap:2px}
.seat{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid #f0ece3;font-size:13px}
.seat .sn{font:700 12px "Cormorant Garamond",Georgia,serif;color:#fff;background:#8a9a8f;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;align-self:center}
.seat .nm2 i{color:#a7a59d;font-style:normal}
.seat .ml2{font-size:11.5px;color:#6d726b;text-align:right}
.seat .ml2 b{color:#b5541c}
.seats.ed .seat{grid-template-columns:22px minmax(0,1.6fr) minmax(0,.8fr) minmax(0,.9fr)}
.seats.ed input{border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-size:12.5px;min-width:0;background:#fff}
.seat-h{display:flex;align-items:baseline;gap:12px;margin:2px 2px 12px;flex-wrap:wrap}
.seat-h h2{font:600 30px "Cormorant Garamond",Georgia,serif;letter-spacing:.06em;text-transform:uppercase}
.seatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;align-items:start}
body.editing .seatgrid{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
.seatc .seats{margin-top:8px}
.seatc .seat{font-size:12px}

/* ===== v7: simple resizable map cards, resizable rings ===== */
.tag.simple{width:max-content;max-width:230px;padding:6px 9px 7px;overflow:hidden;white-space:normal}
.tag.simple .tn{display:flex;align-items:center;gap:6px;font-size:13.5px;margin-bottom:3px;white-space:normal}
.tag.simple .tt{min-width:0}
.tag.simple .tnb{width:17px;height:17px;font-size:10.5px;flex:none}
.tag.simple .tg2{display:grid;grid-template-columns:auto;column-gap:14px;row-gap:1px}
.tag.simple.sized{max-width:none}
.tag.simple.sized .tg2{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.tag.simple .tr{display:grid;grid-template-columns:20px minmax(0,1fr);gap:4px;font-size:10.5px;line-height:1.32}
.tag.simple .tr b{text-align:right;font-variant-numeric:tabular-nums}
.tag.simple .tr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.simple.rs{resize:both;overflow:auto;min-width:96px;min-height:28px}
.tag.simple.rs::after{content:"";position:absolute;right:2px;bottom:2px;width:9px;height:9px;border-right:2px solid #b9a57a;border-bottom:2px solid #b9a57a;pointer-events:none}
.nolists .tag.simple .tg2,.nolists .tag.simple .tsub{display:none}
.ring{width:30px;height:30px}
.ring.rect{border-radius:10px}
.ring .rh{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;border-radius:3px;background:#fff;border:2px solid var(--gold);cursor:nwse-resize;touch-action:none}
.ring.rect .rh{right:-6px;bottom:-6px}

/* ===== v8: minimal map cards, table discs that match the plan ===== */
.tag.simple{padding:3px 6px 3px 7px;border-radius:4px;max-width:190px;line-height:1.2;box-shadow:0 1px 3px rgba(50,40,20,.10)}
.tag.simple::before{top:4px;bottom:4px;width:2px}
.tag.simple .tn{display:flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.1;margin:0 0 1px;white-space:nowrap}
.tag.simple .tn .tx{font-size:9px}
.tag.simple .tnb{width:13px;height:13px;font-size:8.5px;margin-left:auto;flex:none;box-shadow:none}
.tag.simple .tsub{font-size:8.5px;margin:0 0 1px}
.tag.simple .tg2{display:grid;grid-template-columns:auto 1fr;column-gap:4px;row-gap:0}
.tag.simple .tr{display:contents}
.tag.simple .tr b,.tag.simple .tr span{font-size:9.5px;line-height:1.25}
.tag.simple .tr b{font-weight:700;text-align:right}
.tag.simple .tr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.simple.sized .tg2{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));column-gap:10px}
.tag.simple.sized .tr{display:flex;gap:4px;min-width:0}
.tag.simple.rs::after{width:7px;height:7px;right:1px;bottom:1px}
.tag.simple.rs{min-width:70px;min-height:20px}
.tbl{border:1.5px solid #3f3f3f;box-shadow:none}
.tbl:hover{border-color:var(--green);box-shadow:0 0 0 2px rgba(46,74,59,.25)}
.tbl.done{border-color:var(--gold)} .tbl.prog{border-color:var(--prog)}
.tbl .tno{font-size:21px}
.tbl .tgu{font-size:8.5px}

/* ===== v9: ultra-compact map cards ===== */
.tag.simple{padding:2px 4px 2px 5px;border-radius:3px;max-width:180px;border-color:#e0d6c2}
.tag.simple::before{left:0;top:2px;bottom:2px;width:2px;border-radius:1px}
.tag.simple .tn{gap:3px;font-size:11px;line-height:1.05;margin:0}
.tag.simple .tnb{order:2;margin-left:4px;width:12px;height:12px;font-size:8px}
.tag.simple .tt{order:1}
.tag.simple .tsub{font-size:8px;line-height:1.1;margin:0}
.tag.simple .tg2{column-gap:3px;margin-top:1px}
.tag.simple .tr b,.tag.simple .tr span{font-size:9.5px;line-height:1.18}
.tag.simple.sized .tg2{column-gap:8px}

/* ===== v10: custom card resize, no scrollbars ===== */
.tag.simple,.tag.simple.rsz{overflow:visible!important;resize:none!important;height:auto}
.tag.simple.rsz::after{display:none}
.tag.simple .th{position:absolute;right:-5px;bottom:-5px;width:11px;height:11px;border-radius:2px;background:#fff;border:1.5px solid var(--gold);cursor:nwse-resize;touch-action:none;z-index:2}
.tag.simple .th:hover{background:var(--gold)}

.tag.simple.sized .tn{white-space:normal}
.tag.simple.sized .tt{overflow-wrap:anywhere}

/* ===== v11: readable diagram cards ===== */
.tag.simple{background:#fff;border:0;border-left:3px solid var(--gold);border-radius:4px;padding:5px 9px 6px 8px;box-shadow:0 1px 2px rgba(30,40,30,.08),0 2px 8px rgba(30,40,30,.06);max-width:210px}
.tag.simple::before{display:none}
.tag.simple.prog{border-left-color:var(--prog)} .tag.simple.done{border-left-color:var(--done)}
.tag.simple:hover{box-shadow:0 2px 4px rgba(30,40,30,.12),0 6px 16px rgba(30,40,30,.10)}
.tag.simple .tn{display:block;position:static;font:700 13px/1.25 Inter,system-ui,sans-serif;color:#2e4a3b;letter-spacing:0;white-space:nowrap;padding:0 22px 4px 0;margin:0 0 4px;border-bottom:1px solid #ece6da}
.tag.simple .tn .tx{font:600 11px Inter,sans-serif;color:#7d837c}
.tag.simple .tn .ok{color:var(--done)}
.tag.simple .tnb{position:absolute;top:5px;right:6px;margin:0;width:16px;height:16px;font:700 9.5px/1 Inter,sans-serif;box-shadow:none;display:grid;place-items:center}
.tag.simple .tsub{font:500 10px/1.3 Inter,sans-serif;color:#7d837c;margin:-2px 0 3px}
.tag.simple .tg2{column-gap:6px;row-gap:1px;margin-top:0}
.tag.simple .tr b,.tag.simple .tr span{font-size:11px;line-height:1.42}
.tag.simple .tr b{font-weight:700;color:#1f2a22}
.tag.simple .tr span{font-weight:400;color:#3a3f39}
.tag.simple.sized .tg2{column-gap:14px}
.tag.simple.sized .tn{white-space:normal}
.leaders line{stroke:#c9bb98;stroke-width:.8;stroke-dasharray:2 3;opacity:.9}
.leaders line.done{stroke:#9cc3a8} .leaders line.prog{stroke:#e6b98a}
/* location anchors: small dot in day-of, light outline only while editing */
.ring{border:0!important;background:transparent!important;box-shadow:none!important}
.ring .anc{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#7f9686;box-shadow:0 0 0 1.5px #fff;pointer-events:none}
.ring.done .anc{background:var(--gold)} .ring.prog .anc{background:var(--prog)}
.ring:hover .anc{transform:scale(1.4)}
.ring.ed{border:1px dashed rgba(46,74,59,.45)!important}
.ring.ed .anc{display:none}
.ring.target{border:2px solid var(--gold)!important;background:rgba(184,151,90,.15)!important}

/* ===== v12: smaller card text ===== */
.tag.simple{padding:4px 7px 5px 7px;max-width:180px}
.tag.simple .tn{font-size:11px;line-height:1.2;padding:0 17px 3px 0;margin:0 0 3px}
.tag.simple .tn .tx{font-size:9.5px}
.tag.simple .tnb{top:4px;right:5px;width:13px;height:13px;font-size:8px}
.tag.simple .tsub{font-size:8.5px;margin:-1px 0 2px}
.tag.simple .tr b,.tag.simple .tr span{font-size:9.5px;line-height:1.38}
.tag.simple .tg2{column-gap:5px}
.tag.simple.sized .tg2{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));column-gap:12px}

/* ===== v13: subtler guest tables ===== */
.tbl{border:1px solid #b9b3a6!important;background:#fff}
.tbl:hover{border-color:#7f9686!important}
.tbl.done{border-color:#c9b27f!important} .tbl.prog{border-color:#e6b98a!important}
.tbl .tno{font-size:18px;font-weight:600;color:#6b7068}
.tbl .tgu{font-size:7.5px;font-weight:500;color:#9a9d96}

/* ===== v14: no center dots ===== */
.ring .anc{display:none!important}

/* ===== v15: three visual layers ===== */
/* cards: consistent system */
.tag.simple{background:#fff;border:1px solid #e3e6e1;border-left:1px solid #e3e6e1;border-radius:7px;padding:6px 9px 7px;max-width:200px;
  box-shadow:0 1px 2px rgba(30,45,35,.06),0 3px 10px rgba(30,45,35,.07)}
.tag.simple.prog,.tag.simple.done{border-left-color:#e3e6e1}
.tag.simple:hover{box-shadow:0 2px 4px rgba(30,45,35,.10),0 8px 20px rgba(30,45,35,.12)}
.tag.simple .tn{display:flex;align-items:center;gap:6px;font:700 12px/1.2 Inter,system-ui,sans-serif;color:#2e4a3b;white-space:nowrap;
  padding:0 0 5px;margin:0 0 5px;border-bottom:1px solid #edf0ec}
.tag.simple .tnb{position:static;order:0;margin:0;flex:none;width:19px;height:19px;border-radius:50%;background:#2e4a3b;color:#fff;
  font:700 10.5px/1 Inter,sans-serif;display:grid;place-items:center;box-shadow:none}
.tag.simple .tnb.prog{background:var(--prog)} .tag.simple .tnb.done{background:var(--done)}
.tag.simple .tt{order:1}
.tag.simple .tn .tx{font:600 10px Inter,sans-serif;color:#8a918a}
.tag.simple .tsub{font:500 9px/1.3 Inter,sans-serif;color:#8a918a;margin:-2px 0 4px}
/* aligned quantity column */
.tag.simple .tg2{display:grid;grid-template-columns:18px 1fr;column-gap:6px;row-gap:1px}
.tag.simple .tr{display:contents}
.tag.simple .tr b{font:700 10px/1.45 Inter,sans-serif;color:#1f2a22;text-align:right}
.tag.simple .tr span{font:400 10px/1.45 Inter,sans-serif;color:#454b44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.simple.sized .tg2{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));column-gap:14px}
.tag.simple.sized .tr{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px}
/* gold = connectors + markers */
.leaders line,.leaders line.done,.leaders line.prog{stroke:#c4a46a;stroke-width:1.1;stroke-dasharray:1.5 3;stroke-linecap:round;opacity:1}
/* drag handles only on the selected / hovered item */
.tag.simple .th,.ring .rh{opacity:0;pointer-events:none;transition:opacity .12s}
.tag.simple.rsz:hover .th,.tag.simple.selx .th,.ring.ed:hover .rh,.ring.selx .rh{opacity:1;pointer-events:auto}
.ring.ed{border:1px dashed transparent!important}
.ring.ed:hover,.ring.ed.selx{border-color:rgba(196,164,106,.9)!important}
.tag.simple.selx{outline:2px solid #c4a46a;outline-offset:1px}
/* guest tables sit in the marker layer */
.tbl .tno{color:#5f665e}

/* ===== v16: guest initials on chairs ===== */
.gseat{position:absolute;transform:translate(-50%,-50%);width:17px;height:17px;border-radius:50%;border:1.2px solid #fff;padding:0;z-index:5;
  display:grid;place-items:center;font:700 7px/1 Inter,system-ui,sans-serif;letter-spacing:-.1px;color:#fff;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.gseat:hover{transform:translate(-50%,-50%) scale(1.35);z-index:12}
.gseat.s-melanie{background:#5f87a3} .gseat.s-isaac{background:#7d9b63} .gseat.s-both{background:#a07fae} .gseat.s-couple{background:#2e4a3b}
.gseat.dim{opacity:.25}
.noseats .gseat:not(.in){display:none}
.gseat.in{position:static;transform:none;display:inline-grid;vertical-align:middle;width:20px;height:20px;font-size:8.5px;cursor:default;box-shadow:none;border:0}
.gseat.in:hover{transform:none}
.glegend{display:inline-flex;align-items:center;gap:5px;color:#5d635c;font-size:11.5px}
.glegend .gseat.in{width:15px;height:15px;font-size:7px;margin-left:6px}
.seat .gseat.in{align-self:center}
.tbl{min-width:0}
.tbl .tno{font-size:16px;line-height:1}
.tbl .tnm{font:600 6.5px/1.1 Inter,sans-serif;color:#6b7068;max-width:84%;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin:1px 0}
.tbl .tgu{font-size:6.5px}

.tag.simple .tr b,.tag.simple .tr span{line-height:1.32}
.tag.simple.sized .tg2{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.tag.simple .tn{padding-bottom:4px;margin-bottom:4px}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <div class="brand"><h1 id="evTitle">Wedding Setup Plan</h1><div class="sub" id="evSub"></div></div>
    <div class="layouts" id="layoutSw"></div>
    <div class="spacer"></div>
    <div class="progress"><div class="bar"><i id="progBar"></i></div><b id="progTxt">0%</b></div>
    <div class="mode"><button data-mode="view" class="on">Day-of setup</button><button data-mode="edit">Edit design</button></div>
    <button class="btn" id="printBtn">Print</button>
  </div>
  <div class="wrap"><nav class="tabs">
    <button data-tab="plan" data-area="" class="on">Overview</button>
    <button data-tab="plan" data-area="pre">Prefunction</button>
    <button data-tab="plan" data-area="main" id="mainTab">Ballroom</button>
    <button data-tab="seating">Seating</button>
    <button data-tab="inventory">Inventory</button>
    <button data-tab="rules">Venue rules &amp; timing</button>
  </nav></div>
  <div class="editbar hidden" id="editbar"><div class="wrap">
    <b>Edit mode</b> <span class="steps"><b>1</b> Add station → click map <b>2</b> drag items onto its circle <b>3</b> click it for photo &amp; notes</span>
    <span class="spacer"></span>
    <button class="btn sm" id="addStation">+ Add station</button>
    <button class="btn sm" id="replaceImg">Replace this floor plan</button>
    <button class="btn sm" id="restoreBtn">Restore from a saved file</button>
    <input type="file" id="restoreFile" accept=".html,.htm,.json" class="hidden">
    <button class="btn sm" id="resetChecks">Clear checkmarks</button>
    <button class="btn sm gold" id="exportBtn">Download updated file</button>
    <input type="file" id="imgFile" accept="image/*" class="hidden">
  </div></div>
</header>

<main class="wrap">
  <section class="tabpane" id="tab-plan">
    <div class="card fpcard">
      <div class="palette hidden" id="palette"></div>
      <div class="fptools">
        <span id="hintTxt"></span><span class="spacer"></span>
        <span class="glegend"><span class="gseat in s-melanie">M</span>Melanie's guests <span class="gseat in s-isaac">I</span>Isaac's guests <span class="gseat in s-both">B</span>Both <span class="gseat in s-couple">♥</span>Couple</span>
        <label><input type="checkbox" id="tgSeats" checked> Show guest initials</label>
        <label class="tagsonly"><input type="checkbox" id="tgLists" checked> Show item lists on the map</label>
        
        <label>Zoom <input type="range" id="zoom" min="100" max="260" value="100" style="width:110px"></label>
      </div>
      
      <div class="placebar hidden" id="placeBar">📍 <span></span> <button class="btn sm" id="placeCancel">Cancel</button></div>
      <div class="fpscroll"><div class="fp noicons nolists" id="fp"><img id="fpImg" alt="Floor plan" src=""></div></div>
      <div id="tray"></div>
    </div>
    <div id="cards" class="cardsec"></div>
  </section>
  <section class="tabpane hidden" id="tab-stations"><div class="grid" id="stationGrid"></div></section>
  <section class="tabpane hidden" id="tab-inventory"></section>
  <section class="tabpane hidden" id="tab-seating"></section>
  <section class="tabpane hidden" id="tab-rules"></section>
  <div class="printonly" id="printArea"></div>
</main>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="photoFile" accept="image/*" multiple class="hidden">

function renderPalette(){
  const p=$('#palette'); p.classList.toggle('hidden',mode!=='edit'); if(mode!=='edit') return;
  p.innerHTML=`<b style="margin-right:4px">Drag an item onto a station’s circle, or onto empty floor to start a new station:</b>`+D.library.map(l=>`<span class="pi" data-lib="${l.id}" title="${esc(l.name)}">${iconSVG(l).replace('<svg','<svg width="16" height="16"')}${esc(l.short||l.name)}</span>`).join('')+
    `<span class="trash">🗑 Drag an icon here to remove</span>`;
  p.querySelectorAll('.pi').forEach(el=>el.addEventListener('pointerdown',e=>{
    e.preventDefault(); const LB=lib(el.dataset.lib); const g=document.createElement('div'); g.className='ghost'; g.innerHTML=iconSVG(LB); document.body.appendChild(g);
    let tgt=null;
    const mv=ev=>{ g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px'; const t=findTarget(ev.clientX,ev.clientY); if(t!==tgt){ if(tgt) tgt.classList.remove('target'); tgt=t; if(tgt) tgt.classList.add('target'); } }; mv(e);
    const up=ev=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); g.remove(); if(tgt) tgt.classList.remove('target'); dropIcon(LB,ev.clientX,ev.clientY,tgt); };
    window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
  }));
}
function findTarget(cx,cy){
  let best=null, bd=1e9;
  $('#fp').querySelectorAll('.ring,.tbl').forEach(h=>{ const r=h.getBoundingClientRect(); const d=Math.hypot(r.left+r.width/2-cx,r.top+r.height/2-cy); if(d<bd){ bd=d; best=h; } });
  return bd<=40?best:null;
}
function dropIcon(LB,cx,cy,tgt){
  const o=fpToOrig(cx,cy); if(!o.inside) return;
  if(!tgt){ // empty space → new station holding this item
    const s=newStationAt(o.x,o.y,{name:LB.name.replace(/\s*\(.*\)\s*$/,'')||'New station'});
    s.icons.push({lib:LB.id,dx:0,dy:0}); s.items.push({id:uid(),lib:LB.id,qty:'1',note:''});
    save(); renderFloor(); renderHeader(); openModal(s.id,'s0'); toast('New station created — give it a name'); return;
  }
  const s=st(tgt.dataset.sid), i=instances(s).find(x=>x.key===tgt.dataset.key)||instances(s)[0];
  s.icons=s.icons||[]; s.icons.push({lib:LB.id,dx:o.x-i.x,dy:o.y-i.y});
  const it=s.items.find(x=>x.lib===LB.id); if(it) it.qty=String((parseInt(it.qty)||0)+1); else s.items.push({id:uid(),lib:LB.id,qty:'1',note:''});
  save(); renderFloor(); renderHeader(); toast(`Added ${LB.name} to ${s.name}${instances(s).length>1?' (on all '+instances(s).length+')':''}`);
}

function addPhotos(s,files){ const list=[...files].filter(f=>/^image\//.test(f.type)); if(!list.length) return; let n=0;

function loadImage(file,max,cb){ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
  c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.82)); }; img.src=r.result; }; r.readAsDataURL(file); }

function bindCardsOnce(){
  const box=$('#cards');
  const S=e=>{ const c=e.target.closest('.scard'); return c&&c.dataset.sid?st(c.dataset.sid):null; };
  box.addEventListener('click',e=>{
    const s=S(e); if(!s) return; const t=e.target;

    const rp=t.closest('[data-rmph]'); if(rp){ if(confirm('Remove this photo?')){ s.photos.splice(+rp.dataset.rmph,1); s._pi=0; save(); renderCards(); } return; }
    const pb=t.closest('[data-pi]'); if(pb){ s._pi=+pb.dataset.pi; renderCards(); return; }
    if(t.closest('[data-zoom]')){ const l=document.createElement('div'); l.className='lightbox'; l.innerHTML=`<img src="${t.src}" alt="">`; l.onclick=()=>l.remove(); document.body.appendChild(l); return; }
    if(t.closest('[data-open]')){ const i=instances(s)[0]; openModal(s.id,i?i.key:'s0'); return; }
    if(t.closest('[data-locate]')){ const h=document.querySelector(`#fp .mkr[data-sid="${s.id}"]`); if(h){ h.scrollIntoView({behavior:'smooth',block:'center',inline:'center'}); h.classList.add('ping'); setTimeout(()=>h.classList.remove('ping'),1600); } else toast('This station isn’t on the map yet'); return; }
    if(t.closest('[data-sdel]')){ if(confirm(`Delete “${s.name}”?`)){ delStation(s); renderAll(); } return; }
    if(t.closest('[data-iadd]')){ const used=new Set(s.items.map(i=>i.lib)); const LB=D.library.find(l=>!used.has(l.id))||D.library[0]; s.items.push({id:uid(),lib:LB.id,qty:'1',note:''}); save(); renderCards(); return; }
    const del=t.closest('[data-idel]'); if(del){ const id=del.closest('.cr').dataset.iid; const it=s.items.find(x=>x.id===id); s.items=s.items.filter(x=>x!==it); s.icons=(s.icons||[]).filter(ic=>ic.lib!==it.lib); save(); renderCards(); return; }
  });
  box.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.own){ const l=lib(t.dataset.own); l.owned=t.value; save(); return; }
    const s=S(e); if(!s) return;
    if(t.dataset.sf){ s[t.dataset.sf]=t.value; save(); if(t.dataset.sf==='name') renderFloor(); return; }
    if(t.dataset.ie && t.tagName!=='SELECT'){ const it=s.items.find(x=>x.id===t.closest('.cr').dataset.iid); it[t.dataset.ie]=t.value; save(); }
  });
  box.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.own){ renderCards(); return; }
    const s=S(e); if(!s) return;
    if(t.dataset.cchk){ s.checked=s.checked||{}; instances(s).forEach(i=>{ const c=s.checked[i.key]=s.checked[i.key]||{}; c[t.dataset.cchk]=t.checked; }); save(); renderHeader(); renderFloor(); renderCards(); return; }
    if(t.dataset.ie==='lib'){ const it=s.items.find(x=>x.id===t.closest('.cr').dataset.iid); (s.icons||[]).forEach(ic=>{ if(ic.lib===it.lib) ic.lib=t.value; }); it.lib=t.value; save(); renderCards(); }
  });
  ['dragover','dragenter'].forEach(v=>box.addEventListener(v,e=>{ const c=e.target.closest('.cph'); if(c){ e.preventDefault(); c.classList.add('over'); } }));
  box.addEventListener('dragleave',e=>{ const c=e.target.closest('.cph'); if(c) c.classList.remove('over'); });
  box.addEventListener('drop',e=>{ const c=e.target.closest('.cph'); if(!c) return; e.preventDefault(); c.classList.remove('over'); const s=S(e); if(s) addPhotos(s,e.dataTransfer.files); });
}

/* ---------- seats ---------- */
function seatOwner(key){ if(key.startsWith('t:')) return L().tables.find(t=>String(t.n)===key.slice(2)); const s=st(key.slice(2)); return s; }
function seatCount(o){ return Math.max(+o.guests||0,(o.seats||[]).filter(x=>x&&x.name).length); }
function seatsHTML(o,key,ed){
  const cnt=seatCount(o); o.seats=o.seats||[];
  let h=`<div class="seats ${ed?'ed':''}">`;
  for(let k=0;k<cnt;k++){ const x=o.seats[k]||{};
    h+= ed?`<div class="seat"><span class="sn">${k+1}</span><input data-seat="${key}|${k}|name" value="${esc(x.name||'')}" placeholder="Guest name"><input class="meal" data-seat="${key}|${k}|meal" value="${esc(x.meal||'')}" placeholder="Meal"><input class="diet" data-seat="${key}|${k}|diet" value="${esc(x.diet||'')}" placeholder="Dietary"></div>`
           :`<div class="seat">${x.init?`<span class="gseat in s-${esc((x.side||'Both').toLowerCase())}">${esc(x.init)}</span>`:`<span class="sn">${k+1}</span>`}<span class="nm2">${x.name?esc(x.name):'<i>Open seat</i>'}</span><span class="ml2">${esc(x.meal||'')}${x.diet&&!/^none$/i.test(x.diet)?` · <b>${esc(x.diet)}</b>`:''}</span></div>`;
  }
  return h+`</div>`;
}
document.addEventListener('input',e=>{ const t=e.target; if(!t.dataset||!t.dataset.seat) return; const [key,k,f]=t.dataset.seat.split('|'); const o=seatOwner(key); if(!o) return; o.seats=o.seats||[]; o.seats[+k]=o.seats[+k]||{}; o.seats[+k][f]=t.value; save(); });
function parseCSV(txt){ const rows=[]; let r=[],f='',q=false; for(let i=0;i<txt.length;i++){ const c=txt[i];
  if(q){ if(c==='"'){ if(txt[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
  else if(c==='"') q=true; else if(c===','){ r.push(f); f=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; r.push(f); rows.push(r); r=[]; f=''; } else f+=c; }
  if(f!==''||r.length){ r.push(f); rows.push(r); } return rows.filter(x=>x.some(v=>v.trim())); }
function applySeating(rows){
  const lay=D.layouts.find(l=>l.id==='reception'); if(!lay) return 0;
  const by={}; let n=0;
  rows.forEach(r=>{ const m=/table\s*(\d+)/i.exec(r.table||''); let key=null, label='';
    if(m){ key='t'+m[1]; label=((r.table.split(/—|-/)[1])||'').trim(); } else if(/head|estate/i.test(r.table||'')) key='estate'; else return;
    (by[key]=by[key]||{label,list:[]}).list.push({name:r.name,meal:r.meal||'',diet:r.diet||''}); n++; });
  Object.entries(by).forEach(([k,v])=>{
    if(k==='estate'){ const s=lay.stations.find(x=>x.id==='estate'); if(s){ s.seats=v.list; s.guests=v.list.length; } return; }
    const t=lay.tables.find(t=>'t'+t.n===k); if(t){ t.seats=v.list; t.guests=v.list.length; if(v.label) t.label=v.label; } });
  return n;
}
function importSeatingFile(file){
  const r=new FileReader(); r.onload=()=>{ const rows=parseCSV(r.result.replace(/^﻿/,'')); if(rows.length<2){ alert('That file has no rows.'); return; }
    const hd=rows[0].map(x=>x.trim().toLowerCase()); const ix=n=>hd.findIndex(h=>n.some(x=>h===x||h.includes(x)));
    const iT=ix(['table']), iN=ix(['name']), iM=ix(['meal']), iD=ix(['dietary','diet']);
    if(iT<0||iN<0){ alert('Could not find “Table” and “Name” columns in that file.'); return; }
    const list=rows.slice(1).map(c=>({table:c[iT]||'',name:(c[iN]||'').trim(),meal:iM>=0?c[iM]:'',diet:iD>=0?c[iD]:''})).filter(x=>x.name);
    if(!confirm(`Replace the seat names with the ${list.length} guests in “${file.name}”?`)) return;
    const n=applySeating(list); save(); renderAll(); toast(`Seated ${n} guests from ${file.name}`); };
  r.readAsText(file);
}
function renderSeating(){
  const box=$('#tab-seating'); const ed=mode==='edit';
  const lay=L(), est=lay.stations.find(s=>s.id==='estate');
  if(!lay.tables.length && !est){ box.innerHTML=`<div class="card rules"><h2 style="font-size:24px">No tables on this layout</h2><p class="wh">Switch to Reception to see seating.</p></div>`; return; }
  const tables=[...lay.tables].sort((a,b)=>(+a.n||0)-(+b.n||0));
  const total=tables.reduce((a,t)=>a+(+t.guests||0),0)+(est?seatCount(est):0);
  let h=`<div class="seat-h"><h2>Seating</h2><span class="wh">${total} seats · ${tables.length} tables${est?' + estate table':''}</span><span class="spacer"></span>
    ${ed?`<button class="btn sm" id="seatImp">Import guest list (CSV)</button><input type="file" id="seatFile" accept=".csv,text/csv" class="hidden">`:''}</div><div class="seatgrid">`;
  if(est) h+=`<article class="scard seatc"><div class="chd"><span class="nb">${est.tableNo||'E'}</span><div class="hd2"><h3>${est.tableNo?`Table ${est.tableNo} · Estate${est.tableName?' · '+esc(est.tableName):''}`:'Estate table'}</h3><div class="sub">${seatCount(est)} seats</div></div></div>${seatsHTML(est,'s:estate',ed)}</article>`;
  h+=tables.map(t=>`<article class="scard seatc"><div class="chd"><span class="nb">${esc(t.n)}</span><div class="hd2"><h3>Table ${esc(t.n)}${t.label?` · ${esc(t.label)}`:''}</h3><div class="sub">${esc(t.guests)} guests</div></div></div>${seatsHTML(t,'t:'+t.n,ed)}</article>`).join('');
  box.innerHTML=h+`</div>`;
  if($('#seatImp')){ $('#seatImp').onclick=()=>$('#seatFile').click(); $('#seatFile').onchange=e=>{ if(e.target.files[0]) importSeatingFile(e.target.files[0]); e.target.value=''; }; }
}

function needed(id,lay){ const prev=cur; if(lay) cur=lay; let t=0, txt=false, where=[]; L().stations.forEach(s=>{ const n=Math.max(1,instances(s).length); s.items.filter(i=>i.lib===id).forEach(i=>{ const q=parseFloat(i.qty); if(isNaN(q)){ txt=true; where.push(`${s.name}: ${i.qty}`); } else { t+=q*n; where.push(`${s.short||s.name} ${q}${n>1?'×'+n:''}`); } }); }); cur=prev; return {t,txt,where}; }

  D.library.filter(l=>!pf||(pf==='__none'?!(l.provider||'').trim():(l.provider||'').trim()===pf)).forEach(l=>{ const n=needed(l.id); const per=D.layouts.map(x=>needed(l.id,x.id)); const mx=Math.max(...per.map(p=>p.t)); const own=l.owned===''||l.owned==null?null:parseFloat(l.owned);

      :`<td><b>${esc(l.name)}</b></td>`)+

      <td class="n">${ed?`<input data-k="owned" value="${esc(l.owned??'')}" placeholder="—" style="text-align:right">`:(own==null||isNaN(own)?'<span class="wh">—</span>':own)}${ed?'':flag}</td>${ed?`<td><button class="btn sm danger" data-dl>✕</button></td>`:''}</tr>`; });

function renderPrint(){
  let h=`<div class="pp"><h1 style="font-size:22px;margin-bottom:6px">${esc(D.event.title)} — ${esc(L().name)}</h1><div class="fp" id="printFp"><img src="${$('#fpImg').src}" alt=""></div></div>`;
  h+=[...L().stations].sort((a,b)=>(a.order||0)-(b.order||0)).map(s=>{ const n=instances(s).length; return `<div class="pp"><h2 style="font-size:26px">${esc(s.name)}${n>1?` <span class="wh">× ${n}</span>`:''}</h2>
    <div class="pg"><div>${(s.photos||[])[0]?`<img src="${s.photos[0]}" style="width:100%;max-height:6in;object-fit:contain">`:'<div class="wh">No photo</div>'}</div>
    <div><ul class="il">${s.items.map(it=>{ const L=lib(it.lib); return `<li><span class="box"></span><span class="icn">${iconSVG(L)}</span><div><div class="nm">${esc(L.name)}</div>${it.note?`<div class="nt">${esc(it.note)}</div>`:''}</div><div class="q">${esc(it.qty)}</div></li>`; }).join('')}</ul>
    ${s.linen?`<div class="lin"><b>Linen:</b> ${esc(s.linen)}</div>`:''}${s.notes?`<div class="notes">${esc(s.notes)}</div>`:''}</div></div></div>`; }).join('');
  $('#printArea').innerHTML=h; renderFloor($('#printFp'));
}

/* ---------- glue ---------- */
function renderAll(){ renderLayouts(); showImg(); renderHeader(); renderFloor(); renderPalette(); if(tab==='plan') renderCards(); if(tab==='stations') renderStations(); if(tab==='inventory') renderInventory(); if(tab==='rules') renderRules(); if(tab==='seating') renderSeating(); $('#hintTxt').textContent=VARIANT==='tags'?'Tap a card or ring for the photo & checklist · tap a table for its seats':'Tap a ring or map card to jump to its full card below · tap a table for its seats'; }
function setTab(t){ tab=t; document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t&&(t!=='plan'||(b.dataset.area||'')===areaFilter))); document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('hidden',p.id!=='tab-'+t)); renderAll(); window.scrollTo({top:0}); }
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ if(b.dataset.tab==='plan') areaFilter=b.dataset.area||''; setTab(b.dataset.tab); });
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; document.querySelectorAll('.mode button').forEach(x=>x.classList.toggle('on',x===b));
  $('#editbar').classList.toggle('hidden',mode!=='edit'); document.body.classList.toggle('editing',mode==='edit'); $('#fp').classList.toggle('edit',mode==='edit'); renderAll(); if(sel) renderModal(); });
$('#tgSeats').onchange=e=>$('#fp').classList.toggle('noseats',!e.target.checked);
$('#tgLists').onchange=e=>{ $('#fp').classList.toggle('nolists',!e.target.checked); drawAllLines(); };
document.body.classList.add('v-'+VARIANT); if(VARIANT==='cards') $('#fp').classList.add('nolists'); else $('#fp').classList.remove('nolists'); if(VARIANT==='both') document.body.classList.add('v-tags');
window.addEventListener('resize',()=>{ if(tab==='plan') drawAllLines(); });
$('#zoom').oninput=e=>{ $('#fp').style.width=e.target.value+'%'; drawAllLines(); };
$('#printBtn').onclick=()=>{ renderPrint(); setTimeout(()=>window.print(),200); };
window.addEventListener('beforeprint',renderPrint);
$('#photoFile').addEventListener('change',e=>{ const t=sel&&st(sel.id)?st(sel.id):photoTarget; if(t) addPhotos(t,e.target.files); photoTarget=null; e.target.value=''; });
bindCardsOnce();
$('#addStation').onclick=addStationFlow;
const _oldAdd=()=>{ const x=Math.round(C().x+C().w*.52), y=Math.round(C().y+C().h*.08);
  const s={id:uid(),name:'New station',short:'New',zone:'',size:'',spots:[{x,y}],items:[],icons:[],tag:{x:x+25,y:y-12},notes:'',linen:'',photos:[],checked:{},order:Date.now(),_new:true};
  L().stations.push(s); save(); setTab('plan'); openModal(s.id,'s0'); };
$('#resetChecks').onclick=()=>{ if(!confirm('Clear every checkmark?')) return; L().stations.forEach(s=>s.checked={}); save(); renderAll(); };
$('#replaceImg').onclick=()=>{ const f=$('#imgFile'); f.onchange=()=>{ if(f.files[0]) loadImage(f.files[0],2400,u=>{ const im=new Image(); im.onload=()=>{ L().floorplan=u; L().crop={x:0,y:0,w:im.width,h:im.height}; save(); renderAll(); toast('Floor plan replaced — drag stations into place'); }; im.src=u; }); f.value=''; }; f.click(); };
$('#exportBtn').onclick=()=>{ save(); const json=JSON.stringify(D).replace(/</g,'\\u003c');
  const html=ORIGINAL.replace(/(<script id="design-data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download=(D.event.title||'reception-setup-guide').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.html'; document.body.appendChild(a); a.click(); a.remove(); toast('Downloaded — send this file to your planner'); };
$('#placeCancel').onclick=stopPlacing;
$('#fp').addEventListener('pointerdown',e=>{ if(!placing) return; e.preventDefault(); e.stopPropagation(); const o=fpToOrig(e.clientX,e.clientY); const cb=placing; stopPlacing(); cb(o); },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&placing) stopPlacing(); });
$('#restoreBtn').onclick=()=>$('#restoreFile').click();
$('#restoreFile').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ let txt=r.result, obj;
      const m=txt.match(/<script id="design-data" type="application\/json">([\s\S]*?)<\/script>/); obj=JSON.parse(m?m[1]:txt);
      if(!confirm('Replace what is on screen with the design saved in “'+f.name+'”?')) return;
      D=migrate(obj); tidy(D); D.tidyV5=true; cur=D.layouts[0].id; sel=null; save(); renderAll(); toast('Restored from '+f.name);
    }catch(err){ alert('Could not read a saved design from that file. Pick an HTML file downloaded from this guide.'); } };
  r.readAsText(f); };
if(tidied){ save(); setTimeout(()=>toast(`Cleaned up ${tidied} empty duplicate station${tidied>1?'s':''}`),900); }
if(restored){ save(); setTimeout(()=>toast('Your earlier reception edits were brought over'),300); }
renderAll();
})();
</script>
</body>
</html>
