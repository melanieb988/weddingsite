{% extends 'layout.html' %}

{% block body %}
<div class="registry-page">

  <!-- HEADER -->
  <div class="registry-header">
    <img src="{{ url_for('static', filename='images/biltmore1.png') }}" alt="Biltmore Logo" class="registry-logo">
    <h1 class="registry-heading">Our Registry</h1>
    <p class="registry-subtext">For the Life &amp; Adventures Ahead</p>
  </div>

  

  <!-- INTRO -->


  <!-- ZOLA REGISTRY EMBED -->
  <div class="registry-embed-wrap">
    <!--
      Replace the two placeholders below with your real Zola info:
        - MY_ZOLA_URL           -> your full registry URL, e.g. https://www.zola.com/registry/melanieandisaac
        - MY_ZOLA_REGISTRY_KEY  -> the part after zola.com/registry/, e.g. melanieandisaac
      This uses Zola's official embed widget, so the registry renders right on this page.
    -->
    <a class="zola-registry-embed"
       href="https://www.zola.com/registry/"
       data-registry-key="melanieandisaac2026">
       Our Zola Wedding Registry
    </a>
    <script>
      !function(e,t,n){var s,a=e.getElementsByTagName(t)[0];e.getElementById(n)||(s=e.createElement(t),s.id=n,s.async=!0,s.src="https://widget.zola.com/js/widget.js",a.parentNode.insertBefore(s,a))}(document,"script","zola-wjs");
    </script>

    <!-- Fallback, in case the widget doesn't load (ad blockers, etc.) -->
    <noscript>
      <a href="MY_ZOLA_URL" target="_blank" class="registry-fallback-btn">
        View Our Registry on Zola <span class="registry-btn-arrow">→</span>
      </a>
    </noscript>
  </div>

  <!-- ALWAYS-VISIBLE BACKUP LINK -->
  <div class="registry-backup-link-wrap">
    <a href="MY_ZOLA_URL" target="_blank" class="registry-backup-link">
      Prefer to view it directly on Zola? Click here <span class="registry-btn-arrow">→</span>
    </a>
  </div>

</div>

<style>

.registry-page {
  padding: 60px 20px 20px;
  max-width: 700px;
  margin: 0 auto;
}

/* HEADER */

.registry-header {
  text-align: center;
}

.registry-logo {
  height: 48px;
  margin-bottom: 20px;
  opacity: 0.85;
}

.registry-heading {
  font-family: 'Great Vibes', cursive;
  font-size: 3.4rem;
  font-weight: 400;
  color: var(--c-heading);
  text-align: center;
  margin: 0;
}

.registry-subtext {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c-secondary);
  text-align: center;
  margin: 10px 0 0;
}

/* INTRO */

.registry-intro {
  text-align: center;
  max-width: 520px;
  margin: 0 auto 8px;
}

.registry-intro p {
  font-family: 'Montserrat', sans-serif;
  font-weight: 400;
  font-size: 0.85rem;
  color: var(--c-muted);
  line-height: 1.45;
  margin: 0;
}

/* REGISTRY EMBED */

.registry-embed-wrap {
  background: var(--c-bg-panel);
  padding: 40px 28px;
  margin-top: 8px;
  text-align: center;
  min-height: 160px;
}

.registry-fallback-btn {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: transparent;
  color: var(--c-gold);
  border: 1.5px solid var(--c-gold);
  padding: 14px 36px;
  border-radius: 30px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.76rem;
  font-weight: 700;
  text-decoration: none;
  transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
}

.registry-fallback-btn:hover {
  background: var(--c-gold);
  color: #fff;
  transform: translateY(-2px);
}

.registry-btn-arrow {
  display: inline-block;
  transition: transform 0.2s ease;
}

.registry-fallback-btn:hover .registry-btn-arrow,
.registry-backup-link:hover .registry-btn-arrow {
  transform: translateX(3px);
}

/* BACKUP LINK */

.registry-backup-link-wrap {
  text-align: center;
  margin-top: 28px;
}

.registry-backup-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--c-gold);
  text-decoration: none;
}

.registry-backup-link:hover {
  color: var(--c-ink);
}

@media (max-width: 600px) {
  .registry-heading {
    font-size: 2.4rem;
  }

  .registry-embed-wrap {
    padding: 28px 18px;
  }
}

</style>
{% endblock %}
